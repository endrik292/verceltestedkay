/* Whop-Bruecke: Whop-Visitor-ID (_wuid) + Whop-Klick-Parameter an ClickFlare.
   1. Die Visitor-ID steht ab dem ersten Moment fest: vorhandenes _wuid (Cookie/localStorage)
      oder neu im Whop-Format; der Whop-Pixel uebernimmt ein vorhandenes _wuid.
   2. Sie kommt sofort in die LP-URL, damit ClickFlare sie beim Visit (lpurl) als Tracking-Feld liest.
   3. CTA-Klick: Ziel ist immer ClickFlares Direct-Klick-URL mit eingebetteten Klick-Daten
      (redirectUrl mit cep=...), nie der nackte /cf/click-Link, der ein Cookie braucht
      (Safari/ITP, In-App-Browser). Der CTA wird von React erst spaeter gerendert und vom
      ClickFlare-Skript deshalb nicht selbst umgeschrieben. */
(function () {
  "use strict";
  var WHOP_PARAMS = ["waid", "wasid", "wacid", "utm_meta_ad_id", "utm_meta_adset_id", "utm_meta_campaign_id",
    "utm_source", "utm_medium", "utm_campaign", "utm_placement", "utm_content", "utm_adset", "fbclid"];
  var WAIT_FOR_CLICKFLARE_MS = 10000;
  var clickflareFailed = false;
  /* ClickFlare-Tags-Skript nicht ladbar (z. B. Blocker) -> nicht warten */
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (t && t.tagName === "SCRIPT" && /\/cf\/tags\//.test(t.src || "")) clickflareFailed = true;
  }, true);

  function readWuid() {
    var m = document.cookie.match(/(?:^|;\s*)_wuid=([^;]*)/);
    if (m && m[1]) return decodeURIComponent(m[1]);
    try { return localStorage.getItem("_wuid") || undefined; } catch (e) { return undefined; }
  }

  function newWuid() {
    var bytes = new Uint8Array(15);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    var s = "";
    for (var i = 0; i < bytes.length; i++) { var p = bytes[i].toString(36); s += p.length < 2 ? "0" + p : p; }
    return "wuid_" + s.slice(0, 20);
  }

  var wuid = readWuid();
  if (!wuid) {
    try { wuid = newWuid(); } catch (e) { wuid = undefined; }
    if (wuid) {
      document.cookie = "_wuid=" + wuid + "; path=/; max-age=63072000; SameSite=Lax";
      try { localStorage.setItem("_wuid", wuid); } catch (e) {}
    }
  }
  function currentWuid() { return readWuid() || wuid; }

  if (wuid) {
    try {
      var here = new URL(location.href);
      if (here.searchParams.get("wuid") !== wuid) {
        here.searchParams.set("wuid", wuid);
        history.replaceState(history.state, "", here.toString());
      }
    } catch (e) {}
  }

  function extraParams() {
    var out = [], q = new URLSearchParams(location.search), id = currentWuid();
    if (id) out.push(["wuid", id]);
    WHOP_PARAMS.forEach(function (k) { var v = q.get(k); if (v) out.push([k, v]); });
    return out;
  }

  function withParams(url, params) {
    try {
      var u = new URL(url);
      params.forEach(function (p) { u.searchParams.set(p[0], p[1]); });
      return u.toString();
    } catch (e) { return url; }
  }

  /* Original-Klick-Link, egal ob nackt, als javascript:window.clickflare.l="..." oder schon umgeschrieben */
  function originalLink(href) {
    var m = href.match(/^javascript:window\.clickflare\.l="([^"]*)"/);
    return m ? m[1] : href;
  }

  /* gleiche Auswahl wie im ClickFlare-Skript: /cf/click/<n|id|random>, sonst Link 1 */
  function linkIndex(link, links) {
    var m = link.match(/\/cf\/click\/([a-zA-Z0-9_-]+)/);
    if (!m) return 0;
    var n = Number(m[1]);
    if (!isNaN(n)) return Math.max(0, n - 1);
    if (m[1] === "random") return Math.floor(Math.random() * links.length);
    for (var i = 0; i < links.length; i++) if (links[i].id === m[1]) return i;
    return 0;
  }

  function clickTarget(href) {
    var link = originalLink(href);
    var params = extraParams();
    var data = window.clickflare && window.clickflare.data;
    if (/[?&]cep=/.test(link)) return withParams(link, params);
    if (data && data.links && data.links.length) {
      var entry = data.links[linkIndex(link, data.links)] || data.links[0];
      if (entry.reportingUrl) { try { navigator.sendBeacon(entry.reportingUrl); } catch (e) {} }
      var target = entry.redirectUrl;
      try { new URL(link).searchParams.forEach(function (v, k) { params.unshift([k, v]); }); } catch (e) {}
      return withParams(target, params);
    }
    return withParams(link, params); /* Notfall: ClickFlare-Skript nicht geladen (z. B. Blocker) */
  }

  function whenClickflareReady(cb) {
    var waited = 0;
    (function poll() {
      if ((window.clickflare && window.clickflare.data) || clickflareFailed || waited >= WAIT_FOR_CLICKFLARE_MS) return cb();
      waited += 100;
      setTimeout(poll, 100);
    })();
  }

  var leadSent = false, navigating = false;
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf("/cf/click") === -1) return;
    if (ev.button || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;

    ev.preventDefault(); /* Navigation uebernehmen wir selbst; React-onClick laeuft trotzdem */

    if (!leadSent && window.whop) {
      leadSent = true;
      var id = currentWuid();
      window.whop.track("lead", id ? { event_id: "lead_" + id } : {});
    }
    if (navigating) return;
    navigating = true;
    whenClickflareReady(function () {
      var target = clickTarget(href);
      window.__whopCtaTarget = target;
      if (window.__whopCtaNoNavigate) { navigating = false; return; } /* nur fuer Tests */
      /* kurzer Vorlauf, damit der lead-Beacon sicher raus ist */
      setTimeout(function () { location.href = target; }, 300);
    });
  }, true);
})();
