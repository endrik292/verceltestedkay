<script>
/* Whop-Bruecke: Whop-Visitor-ID (_wuid) + Whop-Klick-Parameter an ClickFlare */
(function () {
  "use strict";
  var WHOP_PARAMS = ["waid", "wasid", "wacid", "utm_meta_ad_id", "utm_meta_adset_id", "utm_meta_campaign_id",
    "utm_source", "utm_medium", "utm_campaign", "utm_placement", "utm_content", "utm_adset", "fbclid"];

  function whopVisitorId() {
    var m = document.cookie.match(/(?:^|;\s*)_wuid=([^;]*)/);
    if (m && m[1]) return decodeURIComponent(m[1]);
    try { return localStorage.getItem("_wuid") || undefined; } catch (e) { return undefined; }
  }

  /* wuid in die LP-URL, damit ClickFlare es beim Visit (lpurl) als Tracking-Feld liest */
  function addWuidToUrl(wuid) {
    try {
      var url = new URL(location.href);
      if (url.searchParams.get("wuid") === wuid) return;
      url.searchParams.set("wuid", wuid);
      history.replaceState(history.state, "", url.toString());
    } catch (e) {}
  }

  /* ClickFlare-Visit erst starten, wenn der Whop-Pixel die Visitor-ID gesetzt hat (max. 3 s) */
  window.__whopWait = function (start) {
    var waited = 0, done = false;
    function go() {
      if (done) return;
      var wuid = whopVisitorId();
      if (wuid || waited >= 3000) {
        done = true;
        if (wuid) addWuidToUrl(wuid);
        start();
        return;
      }
      waited += 100;
      setTimeout(go, 100);
    }
    go();
  };

  function extraParams() {
    var out = [], here = new URLSearchParams(location.search);
    var wuid = whopVisitorId();
    if (wuid) out.push(["wuid", wuid]);
    WHOP_PARAMS.forEach(function (k) { var v = here.get(k); if (v) out.push([k, v]); });
    return out;
  }

  function withParams(clickUrl, params) {
    try {
      var url = new URL(clickUrl);
      params.forEach(function (p) { url.searchParams.set(p[0], p[1]); });
      return url.toString();
    } catch (e) { return clickUrl; }
  }

  var leadSent = false;
  document.addEventListener("click", function (ev) {
    var a = ev.target && ev.target.closest ? ev.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href") || "";
    if (href.indexOf("/cf/click") === -1) return;

    var wuid = whopVisitorId();
    if (!leadSent && window.whop) {
      leadSent = true;
      window.whop.track("lead", wuid ? { event_id: "lead_" + wuid } : {});
    }

    var params = extraParams();
    if (!params.length) return;
    var js = href.match(/^(javascript:window\.clickflare\.l=")([^"]*)(".*)$/);
    if (js) {
      a.setAttribute("href", js[1] + withParams(js[2], params) + js[3]);
    } else if (/^https?:/.test(href)) {
      a.setAttribute("href", withParams(href, params));
    }
  }, true);
})();
