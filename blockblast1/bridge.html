<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Freecash x Spotify</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #050505;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      color: #f5f5f5;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Ambient background glow */
    body::before {
      content: '';
      position: fixed;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, hsla(141, 60%, 40%, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      bottom: -30%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, hsla(141, 50%, 35%, 0.04) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 28px;
      position: relative;
      z-index: 1;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 30px hsla(141, 63%, 43%, 0.2), 0 0 60px hsla(141, 63%, 43%, 0.08); }
      50% { box-shadow: 0 0 40px hsla(141, 63%, 43%, 0.3), 0 0 80px hsla(141, 63%, 43%, 0.12); }
    }

    /* Partnership badge — refined */
    .badge {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
    }

    .badge img {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      object-fit: cover;
    }

    .badge img.round {
      border-radius: 50%;
    }

    .badge-sep {
      font-size: 9px;
      color: rgba(255, 255, 255, 0.2);
      font-weight: 300;
    }

    .badge-divider {
      width: 1px;
      height: 14px;
      background: rgba(255, 255, 255, 0.08);
      margin: 0 4px;
    }

    .badge-label {
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: hsla(141, 50%, 55%, 0.7);
      font-weight: 600;
    }

    /* Age question */
    .age-section {
      width: 100%;
      margin-top: 48px;
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
    }

    .age-question {
      font-size: 17px;
      font-weight: 600;
      color: #f5f5f5;
      text-align: center;
      margin-bottom: 24px;
      letter-spacing: -0.01em;
    }

    .age-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .age-btn {
      width: 100%;
      height: 54px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: #f5f5f5;
      font-weight: 500;
      font-size: 15px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .age-btn:active {
      transform: scale(0.97);
    }

    .age-btn.primary {
      border-color: hsla(141, 63%, 43%, 0.3);
      background: hsla(141, 63%, 43%, 0.08);
    }

    .age-btn.primary:hover {
      background: hsla(141, 63%, 43%, 0.14);
      border-color: hsla(141, 63%, 43%, 0.4);
    }

    .age-btn.secondary:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .age-btn .btn-check {
      color: hsl(141, 63%, 43%);
    }

    /* Loading state */
    .age-btn.loading {
      pointer-events: none;
      opacity: 0.7;
    }

    .age-btn .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-top-color: hsl(141, 63%, 43%);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    .age-btn.loading .spinner { display: block; }
    .age-btn.loading .btn-label { display: none; }
    .age-btn.loading .btn-check { display: none; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Bottom note */
    .footer-note {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-top: 20px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.18);
      letter-spacing: 0.02em;
      animation: fadeIn 1s ease 0.7s both;
    }

    .footer-note svg {
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Badge -->
    <div class="badge">
      <img src="images/freecash-logo.png" alt="Freecash" />
      <span class="badge-sep">×</span>
      <img src="images/spotify-logo.png" alt="Spotify" class="round" />
      <div class="badge-divider"></div>
      <span class="badge-label">Offiziell</span>
    </div>

    <!-- Age Question -->
    <div class="age-section">
      <p class="age-question">Wie alt bist du?</p>
      <div class="age-options">
        <button class="age-btn primary" id="over21Btn" onclick="handleAge(false)">

          <span class="btn-label">21 oder älter</span>
          <div class="spinner"></div>
        </button>
      </div>
    </div>

  </div>
